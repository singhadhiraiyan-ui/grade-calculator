<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GradePilot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Willkommen bei GradePilot!</h1>


    <!-- ========================================== -->
    <!-- 📚 FÄCHER UND NOTEN -->
    <!-- ========================================== -->

    <section>

        <h2>📚 Meine Fächer</h2>

        <p>
            Füge deine Fächer hinzu und trage deine Noten ein.
        </p>

        <div id="subjects"></div>

        <br>

        <button id="addSubjectButton">
            ➕ Fach hinzufügen
        </button>

        <p id="overallAverage"></p>

    </section>


    <!-- ========================================== -->
    <!-- 🎯 WELCHE NOTE BRAUCHE ICH? -->
    <!-- ========================================== -->

    <section>

        <h2>🎯 Welche Note brauche ich?</h2>

        <p>
            Dein aktueller Notendurchschnitt:
        </p>

        <input
            type="number"
            id="currentAverage"
            step="0.01"
            min="1"
            max="6"
        >


        <p>
            Anzahl deiner bisherigen Noten:
        </p>

        <input
            type="number"
            id="numberOfGrades"
            min="1"
        >


        <p>
            Dein gewünschter Notendurchschnitt:
        </p>

        <input
            type="number"
            id="targetAverage"
            step="0.01"
            min="1"
            max="6"
        >

        <br><br>

        <button id="calculateNeededGrade">
            Benötigte Note berechnen
        </button>

        <p id="neededGradeResult"></p>

    </section>


    <!-- ========================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================== -->

    <script src="script.js"></script>

</body>

</html>
