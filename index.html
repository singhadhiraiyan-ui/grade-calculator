<!DOCTYPE html>
<html>
<head>
    <title>GradePilot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Willkommen bei GradePilot!</h1>

    <p>Gib deine Note ein:</p>

    <div id="grades">
        <input type="number" class="grade" min="1" max="6">
    </div>

    <button id="addGradeButton">Weitere Note hinzufügen</button>

    <button id="calculateButton">Durchschnitt berechnen</button>

    <p id="result"></p>

<h2>Welche Note brauche ich?</h2>

<p>Mein aktueller Durchschnitt:</p>
<input type="number" id="currentAverage" step="0.01" min="1" max="6">

<p>Mein gewünschter Durchschnitt:</p>
<input type="number" id="targetAverage" step="0.01" min="1" max="6">

<p>Anzahl meiner bisherigen Noten:</p>
<input type="number" id="numberOfGrades" min="1">

<button id="neededGradeButton">Benötigte Note berechnen</button>

<p id="neededGradeResult"></p>

<script src="script.js"></script>

</body>
</html>
