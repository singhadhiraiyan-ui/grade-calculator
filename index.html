<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GradePilot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Willkommen bei GradePilot!</h1>

    <!-- Notendurchschnitt -->
    <section>
        <h2>📚 Notendurchschnitt</h2>

        <p>Gib deine Noten ein:</p>

        <div id="grades">
            <input type="number" class="grade" min="1" max="6">
        </div>

        <br>

        <button id="addGradeButton">
            Weitere Note hinzufügen
        </button>

        <button id="calculateButton">
            Durchschnitt berechnen
        </button>

        <p id="result"></p>
    </section>


    <!-- Benötigte Note -->
    <section>
        <h2>🎯 Welche Note brauche ich?</h2>

        <p>Dein aktueller Notendurchschnitt:</p>
        <input type="number" id="currentAverage" step="0.01" min="1" max="6">

        <p>Anzahl deiner bisherigen Noten:</p>
        <input type="number" id="numberOfGrades" min="1">

        <p>Dein gewünschter Notendurchschnitt:</p>
        <input type="number" id="targetAverage" step="0.01" min="1" max="6">

        <br><br>

        <button id="calculateNeededGrade">
            Benötigte Note berechnen
        </button>

        <p id="neededGradeResult"></p>
    </section>


    <script src="script.js"></script>

</body>
</html>
