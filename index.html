<!DOCTYPE html>
<html>
<head>
    <title>GradePilot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Willkommen bei GradePilot!</h1>

    <p>Gib deine Note ein:</p>

    <div id="grades">
        <input type="number" class="grade" min="1" max="6">
    </div>

    <button id="addGradeButton">Weitere Note hinzufügen</button>

    <button id="calculateButton">Durchschnitt berechnen</button>

    <p id="result"></p>

    <script src="script.js"></script>

</body>
</html>
