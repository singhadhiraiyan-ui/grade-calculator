<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GradePilot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>GradePilot</h1>

    <p>Deine Noten. Dein Überblick. Dein Ziel.</p>

    <h2>Meine Fächer</h2>

    <div id="subjects">

        <!-- Mathematik -->
        <div class="subject">
            <h3>Mathematik</h3>

            <div class="grades">
                <input type="number" class="grade" min="1" max="6" step="1">
            </div>

            <button class="addGradeButton">Weitere Note</button>

            <p class="subjectAverage">
                Durchschnitt: —
            </p>
        </div>


        <!-- Deutsch -->
        <div class="subject">
            <h3>Deutsch</h3>

            <div class="grades">
                <input type="number" class="grade" min="1" max="6" step="1">
            </div>

            <button class="addGradeButton">Weitere Note</button>

            <p class="subjectAverage">
                Durchschnitt: —
            </p>
        </div>


        <!-- Englisch -->
        <div class="subject">
            <h3>Englisch</h3>

            <div class="grades">
                <input type="number" class="grade" min="1" max="6" step="1">
            </div>

            <button class="addGradeButton">Weitere Note</button>

            <p class="subjectAverage">
                Durchschnitt: —
            </p>
        </div>

    </div>


    <button id="addSubjectButton">
        + Neues Fach hinzufügen
    </button>


    <hr>


    <h2>Gesamtdurchschnitt</h2>

    <button id="calculateOverallButton">
        Gesamtdurchschnitt berechnen
    </button>

    <p id="overallResult">
        Gesamtdurchschnitt: —
    </p>


    <script src="script.js"></script>

</body>

</html>
